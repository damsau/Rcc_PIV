# Experiment name
data_name: "default"

# rcc-piv settings
rcc_piv:
  # particle image parameters
  # img_name: "default"   # 名前
  # img_name: "default_turbulence"   # 名前
  # img_name: "uniform_flow"   # 名前
  # img_name: "uniform_shear"   # 名前
  img_name: "water_turbulence_1rps_300fps_100_us1"   # 名前
  img_ext: ".avi"       # 拡張子
  pixel_to_mm: 0.0245901639344    # キャリブレーション定数 [mm / pixel]

  # piv parameters
  start: "None" # 開始点 
  end: "None"  # 終了点
  # pivstep_skip: 3000   # 解析間隔（0:全て） 
  pivstep_skip: 10  # 解析間隔（0:全て） 
  ref_skip_low: 2   # 低速域での参照間隔（0:隣と比較）  <- 最適化
  ref_skip_high: 1  # 高速域での参照間隔（0:隣と比較）  <- 最適化
  rcc_num: 1   # 再帰処理回数
  iw_size: [0, 0, 0, 0, 0]     # 検査領域サイズ [pixel]  <- 最適化
  sw_size: [0, 0, 0, 0, 0]    # 検査領域サイズ [pixel]  <- 最適化
  margin_size: [50, 50, 50, 50, 50] # 余白領域サイズ [pixel]  <- 最適化
  overlap_ratio: [0.5, 0.5, 0.5, 0.5, 0.5]  # 検査領域のオーバーラップ率
  mask_threshold: 5 # 低速域の解析をマスクする閾値  <- 最適化
  error_threshold: [2, 2, 2, 2, 2] # 誤ベクトル判定の閾値
  # error_threshold: [1.5, 1.5, 1.5, 1.5, 1.5] # 誤ベクトル判定の閾値


file_io: 
